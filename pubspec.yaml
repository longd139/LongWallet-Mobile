name: longwallet
description: "LongWallet - Smart Personal Expense Tracker with Bank Notification Listener"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Supabase Client & Auth
  supabase_flutter: ^2.6.0

  # State Management
  provider: ^6.1.2

  # Charts & UI
  fl_chart: ^0.68.0
  intl: ^0.19.0
  uuid: ^4.4.0

  # Local Storage & Biometric Auth
  shared_preferences: ^2.2.3
  local_auth: ^2.2.0

  # Hashing (Anti-duplicate bank transactions)
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
